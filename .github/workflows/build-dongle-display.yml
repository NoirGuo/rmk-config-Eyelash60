name: Build Eyelash60 Bongo dongle firmware

on:
  workflow_dispatch:
  push:
    paths:
      - "Cargo.toml"
      - "memory.x"
      - "keyboard.toml"
      - "vial.json"
      - "firmware/**"
      - ".github/workflows/build-dongle-display.yml"

env:
  RUST_MIN_STACK: "67108864"
  RUST_TOOLCHAIN: "1.96.0"
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: cargo-bins/cargo-binstall@main
      - name: Install RMK tooling and ARM GCC
        run: |
          cargo binstall cargo-make rmkit flip-link -y
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi
      - name: Generate the RMK split project and install custom central code
        run: |
          rmkit create \
            --keyboard-toml-path keyboard.toml \
            --vial-json-path vial.json \
            --version main \
            --target-dir rmk
          cp firmware/central.rs rmk/src/central.rs
          cp firmware/display.rs rmk/src/display.rs
      - name: Pin generated Rust toolchain
        working-directory: rmk
        run: |
          if [ -f rust-toolchain.toml ]; then
            sed -i "s/^channel = .*/channel = \"$RUST_TOOLCHAIN\"/" rust-toolchain.toml
          fi
          rustup toolchain install "$RUST_TOOLCHAIN"
      - name: Cache registry and release target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "rmk -> target"
          key: "nrf52840-eyelash60-dongle-bongo"
      - name: Build central and peripheral release firmware
        working-directory: rmk
        run: |
          cargo build --release
          cargo make uf2 --release
      - name: Upload UF2 firmware
        uses: actions/upload-artifact@v7
        with:
          name: Eyelash60-bongo-firmware_uf2
          path: rmk/*.uf2
      - name: Upload HEX firmware
        uses: actions/upload-artifact@v7
        with:
          name: Eyelash60-bongo-firmware_hex
          path: rmk/*.hex
